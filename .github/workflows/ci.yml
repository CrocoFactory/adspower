name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            experimental: false
          - python: "3.11"
            experimental: false
          - python: "3.12"
            experimental: false
          - python: "3.13"
            experimental: false
          - python: "3.14"
            experimental: false
          - python: "3.15-dev"
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: ${{ matrix.experimental }}
      - run: pip install poetry
      - run: poetry install --all-extras
      - run: poetry run pytest -m "not integration"

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install poetry
      - run: poetry install --all-extras
      - run: poetry run ruff check adspower tests
      - run: poetry run pytest tests/test_v3_client.py --cov --cov-report=term-missing --cov-fail-under=85

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install poetry build twine
      - run: poetry build
      - run: twine check dist/*
      - run: pip install dist/*.whl
      - run: python -c "import adspower; assert adspower.__version__ == '3.0.0'"

  latest-automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -U "httpx<1" "selenium<5" "playwright<2" typing-extensions pytest pytest-asyncio
      - run: pytest -m "not integration"

  minimum-automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install "httpx==0.27.2" "selenium==4.20.0" "playwright==1.45.0" "typing-extensions==4.12.0" pytest pytest-asyncio
      - run: pytest -m "not integration"
