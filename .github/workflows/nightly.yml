name: Nightly compatibility

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -U "httpx<1" "selenium<5" "playwright<2" typing-extensions pytest pytest-asyncio
      - run: pytest tests/test_v3_client.py

  prerelease:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15-dev"
          allow-prereleases: true
      - run: pip install --pre -U "httpx<1" "selenium<5" "playwright<2" typing-extensions pytest pytest-asyncio
      - run: pytest tests/test_v3_client.py
