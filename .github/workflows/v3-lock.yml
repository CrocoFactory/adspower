name: Temporary Poetry lock updater

on:
  push:
    branches: [codex/v3-modernization]

permissions:
  contents: write

jobs:
  update-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v3-modernization
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install poetry
      - run: poetry add --group dev "pyright>=1.1.400,<2"
      - name: Commit lock update
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml poetry.lock
          git commit -m "build: add Pyright to development dependencies"
          git push origin HEAD:codex/v3-modernization
