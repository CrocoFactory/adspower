name: Temporary v3 formatter

on:
  push:
    branches: [codex/v3-modernization]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v3-modernization
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install poetry
      - run: poetry install --all-extras
      - run: poetry run ruff check --fix adspower tests
      - run: poetry run ruff format adspower tests
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adspower tests
          git commit -m "style: format v3 codebase"
          git push origin HEAD:codex/v3-modernization
