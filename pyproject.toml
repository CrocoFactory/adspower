[tool.poetry]
name = 'adspower'
version = '3.0.0'
description = 'The package for interacting with API of anti-detect browser AdsPower.'
authors = ['Alexey <axbelenkov@gmail.com>']
license = 'MIT'
readme = 'README.md'
repository = 'https://github.com/CrocoFactory/adspower'
homepage = 'https://github.com/CrocoFactory/adspower'
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Intended Audience :: Developers',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3.15',
    'License :: OSI Approved :: MIT License',
    'Operating System :: OS Independent',
    'License :: OSI Approved :: MIT License',
    'Typing :: Typed'
]
packages = [{ include = 'adspower' }]

[tool.poetry.dependencies]
python = '>=3.10,<3.16'
httpx = ">=0.27.2,<1.0"
typing-extensions = ">=4.12"
selenium = {version = ">=4.20,<5", optional = true}
playwright = {version = ">=1.45,<2", optional = true}

[tool.poetry.extras]
selenium = ["selenium"]
playwright = ["playwright"]
all = ["selenium", "playwright"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
twine = ">=5,<7"
build = ">=1.2,<2"
pytest-asyncio = ">=0.23,<2"
pytest-cov = ">=5,<8"
ruff = ">=0.8,<1"

[build-system]
requires = ['poetry-core']
build-backend = 'poetry.core.masonry.api'

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires a real AdsPower installation",
]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["adspower_modernization_guide_full_v2.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.coverage.run]
source = [
    "adspower.api",
    "adspower.async_client",
    "adspower.automation",
    "adspower.client",
    "adspower.config",
    "adspower.models",
    "adspower.rate_limit",
    "adspower.transport",
]
